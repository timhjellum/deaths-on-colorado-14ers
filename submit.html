<style>
  :root{
    --ink:#23261F;
    --ink-soft:#5B5F52;
    --paper:#EFECE3;
    --paper-raised:#F7F5EE;
    --sky:#1C7DBE;
    --sky-ink:#0E5C8E;
    --rust:#B0532A;
    --moss:#5B6E4F;
    --line:#C9C3B4;
    --line-strong:#A69E89;
    --shadow: 0 1px 0 rgba(35,38,31,0.06);
    --radius-s:3px;
    --radius-m:6px;
    --font-display:'Newsreader', Georgia, 'Iowan Old Style', serif;
    --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E8E4D8;
      --ink-soft:#A6A190;
      --paper:#1B1D18;
      --paper-raised:#232720;
      --sky:#3E90C9;
      --sky-ink:#8FC4E8;
      --rust:#D9773F;
      --moss:#86A06E;
      --line:#3A3D33;
      --line-strong:#4C5044;
      --shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:480px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow);
    padding:32px;
  }
  h1{
    font-family:var(--font-display);
    font-size:1.5rem;
    font-weight:600;
    margin:0 0 4px;
  }
  .sub{
    color:var(--ink-soft);
    font-size:0.9rem;
    margin:0 0 24px;
    line-height:1.5;
  }
  label{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    margin-bottom:6px;
  }
  input[type="email"],
  input[type="text"],
  input[type="number"],
  select,
  textarea{
    width:100%;
    padding:10px 12px;
    font-family:var(--font-body);
    font-size:0.95rem;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line-strong);
    border-radius:var(--radius-s);
  }
  textarea{ resize:vertical; }
  input[type="email"]:focus,
  input[type="text"]:focus,
  input[type="number"]:focus,
  select:focus,
  textarea:focus{
    outline:2px solid var(--sky);
    outline-offset:1px;
  }
  .field{ margin-top:16px; }
  .field:first-of-type{ margin-top:0; }
  .row{ display:flex; gap:12px; }
  .row .field{ flex:1; margin-top:16px; }
  button{
    width:100%;
    margin-top:16px;
    padding:11px 12px;
    font-family:var(--font-body);
    font-size:0.95rem;
    font-weight:600;
    color:#fff;
    background:var(--sky);
    border:none;
    border-radius:var(--radius-s);
    cursor:pointer;
  }
  button:hover{ background:var(--sky-ink); }
  button:disabled{ opacity:0.6; cursor:default; }
  .msg{
    margin-top:16px;
    font-size:0.88rem;
    line-height:1.5;
    padding:10px 12px;
    border-radius:var(--radius-s);
    display:none;
  }
  .msg.show{ display:block; }
  .msg.info{ background:rgba(28,125,190,0.12); color:var(--sky-ink); }
  .msg.error{ background:rgba(176,83,42,0.12); color:var(--rust); }
  .msg.success{ background:rgba(91,110,79,0.12); color:var(--moss); }
  .signed-in-email{ font-family:var(--font-mono); font-size:0.85rem; }
  #signOut{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line-strong);
    margin-top:24px;
  }
  #signOut:hover{ background:var(--paper); color:var(--ink); }
  .placeholder{
    margin-top:24px;
    padding:16px;
    border:1px dashed var(--line-strong);
    border-radius:var(--radius-s);
    color:var(--ink-soft);
    font-size:0.88rem;
    line-height:1.5;
  }
</style>
</head>
<body>

<div class="card">

  <!-- Shown when nobody is logged in -->
  <div id="loginView">
    <h1>Report an Incident</h1>
    <p class="sub">Enter your email and we'll send you a one-time link to sign in. No password needed.</p>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <button id="sendLink">Send me a login link</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- Shown after they click the magic link and land back here -->
  <div id="loggedInView" style="display:none;">
    <h1>You're signed in</h1>
    <p class="sub">Signed in as <span class="signed-in-email" id="userEmail"></span></p>

    <form id="incidentForm">
      <div class="field">
        <label for="mountain">Mountain</label>
        <input type="text" id="mountain" placeholder="e.g. Longs Peak" required>
      </div>

      <div class="row">
        <div class="field">
          <label for="year">Year</label>
          <input type="number" id="year" placeholder="e.g. 2019" min="1800" max="2100" required>
        </div>
        <div class="field">
          <label for="month">Month (optional)</label>
          <input type="number" id="month" min="1" max="12" placeholder="1–12">
        </div>
        <div class="field">
          <label for="day">Day (optional)</label>
          <input type="number" id="day" min="1" max="31" placeholder="1–31">
        </div>
      </div>

      <div class="field">
        <label for="cause">Cause</label>
        <input type="text" id="cause" placeholder="e.g. Fall, Altitude sickness, Lightning" required>
      </div>

      <div class="field">
        <label for="climberName">Climber's name (optional)</label>
        <input type="text" id="climberName" placeholder="Leave blank if unknown">
      </div>

      <div class="row">
        <div class="field">
          <label for="gender">Gender (optional)</label>
          <select id="gender">
            <option value="">Unknown</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="age">Age (optional)</label>
          <input type="text" id="age" placeholder="e.g. 34">
        </div>
      </div>

      <div class="field">
        <label for="details">Additional details (optional)</label>
        <textarea id="details" rows="4" placeholder="Route, conditions, sourcing — anything else worth noting."></textarea>
      </div>

      <button type="submit" id="submitIncident">Submit for review</button>
      <div class="msg" id="formMsg"></div>
    </form>

    <p class="sub" style="margin-top:16px;">Submissions are reviewed before anything is published — this doesn't go live automatically.</p>

    <button id="signOut">Sign out</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginView = document.getElementById('loginView');
  const loggedInView = document.getElementById('loggedInView');
  const emailInput = document.getElementById('email');
  const sendLinkBtn = document.getElementById('sendLink');
  const loginMsg = document.getElementById('loginMsg');
  const userEmailEl = document.getElementById('userEmail');
  const signOutBtn = document.getElementById('signOut');

  const incidentForm = document.getElementById('incidentForm');
  const submitBtn = document.getElementById('submitIncident');
  const formMsg = document.getElementById('formMsg');
  const mountainInput = document.getElementById('mountain');
  const yearInput = document.getElementById('year');
  const monthInput = document.getElementById('month');
  const dayInput = document.getElementById('day');
  const causeInput = document.getElementById('cause');
  const climberNameInput = document.getElementById('climberName');
  const genderInput = document.getElementById('gender');
  const ageInput = document.getElementById('age');
  const detailsInput = document.getElementById('details');

  // Filled in once we know who's signed in — the insert below uses this
  // rather than trusting anything the form itself could claim.
  let currentUser = null;

  function showMsg(el, text, kind){
    el.textContent = text;
    el.className = 'msg show ' + kind;
  }

  function showLoggedIn(session){
    loginView.style.display = 'none';
    loggedInView.style.display = 'block';
    userEmailEl.textContent = session.user.email;
    currentUser = session.user;
  }

  function showLoggedOut(){
    loginView.style.display = 'block';
    loggedInView.style.display = 'none';
    currentUser = null;
  }

  sendLinkBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email){
      showMsg(loginMsg, 'Enter an email address first.', 'error');
      return;
    }
    sendLinkBtn.disabled = true;
    sendLinkBtn.textContent = 'Sending…';

    const { error } = await client.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: window.location.origin + '/submit.html'
      }
    });

    sendLinkBtn.disabled = false;
    sendLinkBtn.textContent = 'Send me a login link';

    if (error){
      showMsg(loginMsg, 'Something went wrong: ' + error.message, 'error');
    } else {
      showMsg(loginMsg, 'Check your inbox — click the link there to come back here signed in.', 'success');
    }
  });

  signOutBtn.addEventListener('click', async () => {
    await client.auth.signOut();
    showLoggedOut();
  });

  incidentForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!currentUser){
      showMsg(formMsg, 'You need to be signed in to submit — try refreshing the page.', 'error');
      return;
    }

    const mountain = mountainInput.value.trim();
    const year = yearInput.value.trim();
    const cause = causeInput.value.trim();

    if (!mountain || !year || !cause){
      showMsg(formMsg, 'Mountain, year, and cause are required.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    // Every row is tagged with the signed-in user's own id. The database's
    // row-level security policy double-checks this matches whoever is
    // actually authenticated — the app can't get this wrong even if it tried.
    const { error } = await client.from('incidents').insert({
      mountain,
      year: Number(year),
      month: monthInput.value ? Number(monthInput.value) : null,
      day: dayInput.value ? Number(dayInput.value) : null,
      cause,
      climber_name: climberNameInput.value.trim() || null,
      gender: genderInput.value || null,
      age: ageInput.value.trim() || null,
      incident_details: detailsInput.value.trim() || null,
      submitted_by: currentUser.id
    });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit for review';

    if (error){
      showMsg(formMsg, 'Something went wrong: ' + error.message, 'error');
    } else {
      showMsg(formMsg, 'Thanks — your submission is in for review.', 'success');
      incidentForm.reset();
    }
  });

  // Supabase's JS library automatically reads the login info out of the URL
  // when you land back here from the emailed link, then fires this event.
  client.auth.onAuthStateChange((event, session) => {
    if (session){
      showLoggedIn(session);
    } else {
      showLoggedOut();
    }
  });

  // Also check on page load in case a session already exists (e.g. you
  // refresh the page after signing in).
  client.auth.getSession().then(({ data: { session } }) => {
    if (session){
      showLoggedIn(session);
    }
  });
</script>

</body>
</html>
