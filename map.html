<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deaths on Colorado 14ers — Map</title>
<meta name="description" content="Live map of fatalities on Colorado's fourteeners, pulled directly from the incident database." />

<!--
  No account, no API key, no environment variable -- Leaflet + free
  OpenStreetMap-based tiles need none of that. This page is entirely
  self-contained: it just fetches /export.geojson (already live on your
  site) and draws it. Nothing to configure before deploying.
-->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --border: #2c313a;
    --text: #e8e9ec;
    --text-dim: #9aa0ab;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  #status {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: var(--text-dim); max-width: 320px;
  }
  #status.error { color: #ff8a80; }
  #status.hidden { display: none; }

  #legend {
    position: absolute; bottom: 24px; left: 12px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 12px; max-width: 220px;
  }
  #legend h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }

  /* Custom marker: a colored circle with the death count inside, sized by count. */
  .mtn-marker {
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1.5px solid var(--bg);
    color: #fff; font-size: 11px; font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .leaflet-popup-content-wrapper {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px;
  }
  .leaflet-popup-content { margin: 14px 16px; max-width: 280px; }
  .leaflet-popup-tip { background: var(--panel); border: 1px solid var(--border); }
  .leaflet-popup-close-button { color: var(--text-dim) !important; }

  .popup-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .popup-sub { font-size: 12px; color: var(--text-dim); margin: 0 0 10px; }
  .incident { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
  .incident:first-of-type { border-top: none; }
  .incident .climber { font-weight: 600; }
  .incident .meta { color: var(--text-dim); }
</style>
</head>
<body>

<div id="status">Loading incident data…</div>
<div id="legend" class="hidden"></div>
<div id="map"></div>

<script>
(function () {
  var statusEl = document.getElementById("status");
  var legendEl = document.getElementById("legend");

  var map = L.map("map", { zoomControl: true }).setView([38.9, -106.2], 7);

  // CartoDB's dark basemap -- free, no signup, no key. Attribution required
  // (included below), that's the whole cost of using it.
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: "abcd",
    maxZoom: 19
  }).addTo(map);

  // Radius scales with death count so heavily-fatal peaks (Capitol, Longs,
  // Maroon Bells...) read as visually heavier -- same idea as the old
  // Mapbox circle-radius interpolation, just done by hand here.
  function radiusFor(count) {
    if (count >= 30) return 26;
    if (count >= 15) return 19;
    if (count >= 5) return 14;
    return 9;
  }

  fetch("/export.geojson")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (geojson) {
      if (!geojson.features || !geojson.features.length) {
        statusEl.textContent = "No approved incidents found in the database yet.";
        return;
      }

      statusEl.className = "hidden";

      geojson.features.forEach(function (f) {
        var p = f.properties;
        var lat = f.geometry.coordinates[1];
        var lon = f.geometry.coordinates[0];
        var r = radiusFor(p.death_count);

        var icon = L.divIcon({
          className: "",
          html: '<div class="mtn-marker" style="width:' + (r * 2) + 'px;height:' + (r * 2) + 'px;background:' + p.range_color + ';">' + p.death_count + "</div>",
          iconSize: [r * 2, r * 2],
          iconAnchor: [r, r]
        });

        var incidents = typeof p.incidents === "string" ? JSON.parse(p.incidents) : p.incidents;
        var popupHtml = "<div class=\"popup-title\">" + p.mountain + "</div>" +
          "<div class=\"popup-sub\">" + p.range + " Range &middot; " + p.death_count + " recorded death" + (p.death_count === 1 ? "" : "s") + "</div>" +
          incidents.map(function (r2) {
            return "<div class=\"incident\">" +
              "<div class=\"climber\">" + r2.climber + "</div>" +
              "<div class=\"meta\">" + r2.date + " &middot; Age " + r2.age + " &middot; " + r2.sex + "</div>" +
              "<div>" + r2.cause + "</div>" +
              "</div>";
          }).join("");

        L.marker([lat, lon], { icon: icon })
          .addTo(map)
          .bindPopup(popupHtml, { maxWidth: 300 });
      });

      // Legend: one swatch per distinct range color actually present.
      var seen = {};
      geojson.features.forEach(function (f) {
        seen[f.properties.range + "|" + f.properties.range_color] = true;
      });
      var rows = Object.keys(seen).map(function (key) {
        var parts = key.split("|");
        return "<div class=\"legend-row\"><span class=\"legend-swatch\" style=\"background:" + parts[1] + "\"></span>" + parts[0] + "</div>";
      }).sort().join("");
      legendEl.innerHTML = "<h4>Range</h4>" + rows;
      legendEl.className = "";
    })
    .catch(function (err) {
      statusEl.className = "error";
      statusEl.textContent = "Failed to load /export.geojson: " + err.message +
        ". If this is a fresh deploy, check that mountains_public_read_policy.sql has been run in Supabase (RLS blocking anon reads is the usual cause).";
    });
})();
</script>

</body>
</html>
