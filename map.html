<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deaths on Colorado 14ers — Map</title>
<meta name="description" content="Live map of fatalities on Colorado's fourteeners, pulled directly from the incident database." />

<!--
  No account, no API key, no environment variable -- Leaflet + free
  OpenStreetMap-based tiles need none of that. This page is entirely
  self-contained: it just fetches /export.geojson (already live on your
  site) and draws it. Nothing to configure before deploying.
-->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Marker clustering: each death is its own marker (like the old KML),
     but deaths on the same mountain share that mountain's exact coordinates
     and would otherwise stack invisibly on top of each other. This groups
     them into a numbered cluster when zoomed out, and "spiderfies" them
     into individually-clickable markers when you click a cluster in close. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --border: #2c313a;
    --text: #e8e9ec;
    --text-dim: #9aa0ab;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; background: var(--bg); }

  #status {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: var(--text-dim); max-width: 320px;
  }
  #status.error { color: #ff8a80; }
  #status.hidden { display: none; }

  #legend {
    position: absolute; bottom: 24px; left: 12px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 12px; max-width: 220px;
  }
  #legend h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }

  /* Individual incident marker: a small colored dot. */
  .incident-marker {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid
