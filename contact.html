<head>
    <meta charset="utf-8">

    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/images/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="theme-color" content="#1B1D18">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="subpage">
    <div class="wrap">
        <header>
            <a class="site-brand" href="/">
                <img src="./deaths-on-colorados-fourteeners.svg" alt="">
                <span>Deaths on Colorado&#x27;s <em>Fourteeners (14er)</em></span>
            </a>
        </header>

        <main class="panel page-panel page-panel--narrow">
            <h1>Contact the Team</h1>
            <p class="page-lede">Corrections, new information about an incident, or questions about the project.</p>
            <form name="contact" netlify>
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name">
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                </div>
                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6"></textarea>
                </div>
                <button type="submit">Send</button>
            </form>
        </main>

        <footer>
            <span>
                Deaths on Colorado Fourteeners (14ers) · <a href="/">Home</a> · <a href="submit.html">Submit an incident</a> · <a href="contact.html">Contact</a> · <a href="about.html">About</a>
            </span>
        </footer>
    </div>
</body>

</html>
